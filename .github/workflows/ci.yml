name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm ci
      - run: psql -h localhost -U postgres -c 'CREATE DATABASE linkpulse_test' -c 'CREATE DATABASE linkpulse'
      - run: npm run sync:check   # shared/ and both backend copies must match
      - run: npm run typecheck
      - run: npm test
      - run: PGURL=postgres://postgres:postgres@localhost:5432 ./supabase/tests/run.sh
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E (desktop + mobile)
        run: |
          (cd server && NODE_ENV=production DATABASE_URL=postgres://postgres:postgres@localhost:5432/linkpulse COOKIE_SECURE=false TRUST_PROXY=false SHORT_BASE_URL=http://localhost:4000 APP_ORIGIN=http://localhost:4000 node dist/index.js &)
          npx -y wait-on http://localhost:4000/api/health
          npm run e2e
